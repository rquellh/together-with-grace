<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <g id="disc-l" fill="none" stroke="#0E4A63">
      <circle r="58" stroke-width="9"/>
      <circle r="42" stroke-width="9"/>
      <circle r="26" stroke-width="9"/>
      <circle r="12" fill="#E9670D" stroke="none"/>
    </g>
    <g id="disc-s" fill="none" stroke="#0E4A63">
      <circle r="40" stroke-width="8"/>
      <circle r="24" stroke-width="8"/>
      <circle r="9" fill="#E9670D" stroke="none"/>
    </g>
    <g id="seed">
      <ellipse rx="5.5" ry="13" cy="-11" fill="#0E4A63"/>
      <ellipse rx="5.5" ry="13" cy="-11" fill="#0E4A63" transform="rotate(90)"/>
      <ellipse rx="5.5" ry="13" cy="-11" fill="#0E4A63" transform="rotate(180)"/>
      <ellipse rx="5.5" ry="13" cy="-11" fill="#0E4A63" transform="rotate(270)"/>
      <circle r="3.5" fill="#E9670D"/>
    </g>
    <g id="dots" fill="#0E4A63">
      <circle r="3"/>
      <circle cy="-9" r="3"/>
      <circle cy="9" r="3"/>
      <circle cx="-9" r="3"/>
      <circle cx="9" r="3"/>
    </g>
  </defs>
  <rect width="280" height="280" fill="#002B3C"/>
  <use href="#disc-l" x="140" y="140"/>
  <use href="#disc-s" x="0" y="0"/>
  <use href="#disc-s" x="280" y="0"/>
  <use href="#disc-s" x="0" y="280"/>
  <use href="#disc-s" x="280" y="280"/>
  <use href="#seed" x="140" y="0"/>
  <use href="#seed" x="140" y="280"/>
  <use href="#seed" x="0" y="140"/>
  <use href="#seed" x="280" y="140"/>
  <use href="#dots" x="70" y="210"/>
  <use href="#dots" x="210" y="70"/>
</svg>
