name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read the Pages site address
        id: pages
        uses: actions/configure-pages@v5
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Site address read from the repository's Pages settings, so the build
          # follows the custom domain once it is set (re-run after changing it).
          # Project URL: base_path is /together-with-grace; custom domain: "".
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
